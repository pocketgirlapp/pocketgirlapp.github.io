<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Girl Classic — Official Developer Website</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
        .card { background: #1e293b; border-radius: 16px; padding: 36px; max-width: 580px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); border: 1px solid #334155; text-align: center; }
        .badge { display: inline-block; background: #ec4899; color: white; padding: 6px 14px; border-radius: 9999px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
        h1 { font-size: 28px; margin-bottom: 12px; color: #ffffff; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        a.btn { display: inline-block; background: #2563eb; color: white; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
        a.btn:hover { background: #1d4ed8; }
        a.btn-secondary { background: #334155; }
        a.btn-secondary:hover { background: #475569; }
        footer { margin-top: 30px; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Official App</span>
        <h1>Pocket Girl Classic</h1>
        <p>Bienvenido al sitio oficial de soporte y políticas para las aplicaciones móviles de nuestro estudio de desarrollo.</p>
        <div class="links">
            <a href="app-ads.txt" class="btn">Ver archivo app-ads.txt</a>
        </div>
        <footer>
            &copy; 2026 Pocket Girl Classic. Todos los derechos reservados.
        </footer>
    </div>
</body>
</html>
